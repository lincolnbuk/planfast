<svg viewBox="0 0 256 228" width="256" height="228" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
  <defs>
    <style>
      .react-circle { fill: none; stroke: #61dafb; stroke-width: 2; }
      .react-dot { fill: #61dafb; }
    </style>
  </defs>
  
  <!-- Background glow effect -->
  <circle cx="128" cy="114" r="110" fill="none" stroke="#61dafb" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Main electron orbits -->
  <ellipse cx="128" cy="114" rx="70" ry="20" class="react-circle" opacity="0.8"/>
  <ellipse cx="128" cy="114" rx="70" ry="20" class="react-circle" opacity="0.8" transform="rotate(60 128 114)"/>
  <ellipse cx="128" cy="114" rx="70" ry="20" class="react-circle" opacity="0.8" transform="rotate(120 128 114)"/>
  
  <!-- Electron dots -->
  <circle cx="198" cy="114" r="3.5" class="react-dot"/>
  <circle cx="83" cy="64" r="3.5" class="react-dot"/>
  <circle cx="83" cy="164" r="3.5" class="react-dot"/>
  
  <!-- Center nucleus -->
  <circle cx="128" cy="114" r="8" class="react-dot"/>
  
  <!-- Glow effect for nucleus -->
  <circle cx="128" cy="114" r="12" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.4"/>
  <circle cx="128" cy="114" r="15" fill="none" stroke="#61dafb" stroke-width="0.5" opacity="0.2"/>
</svg>